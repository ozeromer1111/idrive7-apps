<!-- accent: #e60012 -->
<!-- BMW M karbon bucket koltuk, onden; referans: OEM G82 M4 karbon koltuk -->
<defs>
  <radialGradient id="k-halo" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#ff5a5a" stop-opacity="0.45"/><stop offset="0.55" stop-color="#c00" stop-opacity="0.12"/><stop offset="1" stop-color="#c00" stop-opacity="0"/></radialGradient>
  <linearGradient id="k-shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6dbe1"/><stop offset="0.5" stop-color="#b3b9c1"/><stop offset="1" stop-color="#8d939b"/></linearGradient>
  <linearGradient id="k-pad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#242a32"/><stop offset="1" stop-color="#0b0e13"/></linearGradient>
  <linearGradient id="k-carb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#05070a"/></linearGradient>
  <linearGradient id="k-cush" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ced5"/><stop offset="1" stop-color="#9299a1"/></linearGradient>
  <radialGradient id="k-mg" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#eaf4ff"/><stop offset="0.65" stop-color="#9fd0ff" stop-opacity="0.55"/><stop offset="1" stop-color="#9fd0ff" stop-opacity="0"/></radialGradient>
</defs>

<circle cx="70" cy="60" r="58" fill="url(#k-halo)"/>

<!-- SIRTLIK dis kabuk: iki omuz destegi + entegre baslik -->
<path d="M30 97
         L27 68
         C26 52 28 46 34 42
         C42 40 48 38 50 33
         L51 24
         C52 16 60 12 70 12
         C80 12 88 16 89 24
         L90 33
         C92 38 98 40 106 42
         C112 46 114 52 113 68
         L110 97 Z"
      fill="url(#k-shell)" stroke="#5a636f" stroke-width="2.2" stroke-linejoin="round"/>

<!-- ic dolgu (koyu minder) -->
<path d="M44 92 L43 54 C43 45 47 41 55 40 L85 40 C93 41 97 45 97 54 L96 92 Z"
      fill="url(#k-pad)" stroke="#2c333c" stroke-width="1.4" stroke-linejoin="round"/>

<!-- orta karbon serit -->
<rect x="60" y="40" width="20" height="52" rx="3" fill="url(#k-carb)"/>
<path d="M64 44 l0 44 M70 42 l0 48 M76 44 l0 44" stroke="#070a0d" stroke-width="1.6"/>
<!-- yan dolgu dikis (kirmizi M vurgu) -->
<path d="M52 48 l0 40 M88 48 l0 40" stroke="#e10a1a" stroke-width="1.3" opacity="0.5"/>

<!-- baslik: isikli ///M -->
<ellipse cx="70" cy="28" rx="20" ry="11" fill="url(#k-mg)"/>
<rect x="55" y="23" width="30" height="12" rx="3" fill="#05070a" stroke="#3a434e" stroke-width="1.1"/>
<g>
  <polygon points="58.5,34 61.5,24.5 64.5,24.5 61.5,34" fill="#18a0dd"/>
  <polygon points="62.5,34 65.5,24.5 68.5,24.5 65.5,34" fill="#0b2f74"/>
  <polygon points="66.5,34 69.5,24.5 72.5,24.5 69.5,34" fill="#e2231a"/>
  <text x="74" y="33" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#eaf0f6">M</text>
</g>

<!-- OTURMA MINDERI: ust yuz + on dudak, iki yan destek + orta kanal -->
<path d="M34 95 L106 95 L117 112 L23 112 Z" fill="url(#k-cush)" stroke="#5a636f" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M23 112 L117 112 L114 123 C114 126 111 127 107 127 L33 127 C29 127 26 126 26 123 Z"
      fill="url(#k-pad)" stroke="#5a636f" stroke-width="2" stroke-linejoin="round"/>
<!-- orta kanal -->
<path d="M63 96 L77 96 L80 111 L60 111 Z" fill="url(#k-carb)"/>
<!-- yan destek govdeleri -->
<path d="M35 96 L52 96 L50 111 L28 111 Z" fill="#aeb4bc" opacity="0.6"/>
<path d="M88 96 L105 96 L112 111 L90 111 Z" fill="#aeb4bc" opacity="0.6"/>
<!-- on dudak kirmizi dikis -->
<path d="M34 118 l20 0 M86 118 l20 0" stroke="#e10a1a" stroke-width="1.3" opacity="0.5"/>
